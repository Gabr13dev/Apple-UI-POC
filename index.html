<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iphone Duo System Re:create - Mail App</title>
<style>
  :root{
    --bg: #d9d9d9;
    --frame: #ffffff;
    --text-primary: #1c1c1e;
    --text-secondary: #8a8a8e;
    --divider: #e2e2e4;
    --btn-bg: #efeff1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background:
      repeating-linear-gradient(0deg, #cfcfcf 0px, #cfcfcf 1px, #d9d9d9 1px, #d9d9d9 90px),
      repeating-linear-gradient(90deg, #cfcfcf 0px, #cfcfcf 1px, #d9d9d9 1px, #d9d9d9 90px);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  /* The tilted device */
  .device {
    position: relative;
    width: 620px;
    max-width: 92vw;
    height: 760px;
    background: var(--frame);
    border-radius: 34px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.28),
      0 8px 20px rgba(0,0,0,0.15);
    display: flex;
    overflow: hidden;
  }

  .mail-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 34px 10px 0 34px;
    position: relative;
  }

  /* Header row */
  .mail-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--divider);
  }

  .sender-block {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(160deg, #bcd7ea 0%, #8fb7d8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .avatar svg { width: 100%; height: 100%; }

  .sender-text .name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 0 0 2px 0;
  }

  .sender-text .to-line {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .sender-text .to-line .chev {
    font-size: 11px;
    color: var(--text-secondary);
  }

  .date-block {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: right;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .date-block .icon {
    color: var(--text-secondary);
  }

  /* Subject + body */
  .mail-subject {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 22px 0 16px 0;
  }

  .mail-body {
    font-size: 16px;
    line-height: 1.55;
    color: var(--text-primary);
    max-width: 460px;
  }

  .mail-body p {
    margin: 0 0 22px 0;
  }

  .signoff {
    margin: 0;
  }

  /* Attached image, bleeds to panel edges */
  .attachment {
    margin-top: auto;
    margin-left: -34px;
    width: calc(100% + 34px);
    height: 260px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }

  .attachment img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Right-hand control rail */
  .control-rail {
    width: 92px;
    background: var(--frame);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 26px 0 20px 0;
  }

  .status-dot {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #0e0e10;
    margin-bottom: 14px;
  }

  .clock {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .icon {
    width: 19px;
    height: 19px;
    display: block;
    transition: transform 0.2s ease;
  }

  .icon-sm {
    width: 15px;
    height: 15px;
  }

  .wifi-btn, .nav-pill, .action-btn {
    background: var(--btn-bg);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
  }

  /* Shared "spinning arc" ring used on hover to hint at each icon's action */
  .ctrl-btn {
    position: relative;
    z-index: 0;
  }

  .ctrl-btn::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: conic-gradient(from -90deg, var(--accent, #0a84ff) 0deg 110deg, transparent 110deg 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    opacity: 0;
    transform: rotate(0deg);
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: -1;
  }

  .ctrl-btn:hover::after {
    opacity: 1;
    animation: ring-spin 1s linear infinite;
  }

  @keyframes ring-spin {
    to { transform: rotate(360deg); }
  }

  /* Per-action icon hints, triggered together with the ring on hover */
  @keyframes icon-shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }
  @keyframes icon-drop {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(4px); }
  }
  @keyframes icon-lift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes icon-slide-left {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(-4px); }
  }
  @keyframes icon-write {
    0%, 100% { transform: rotate(0deg) translate(0, 0); }
    50% { transform: rotate(-14deg) translate(-1px, 1px); }
  }
  @keyframes icon-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  @keyframes icon-send {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(3px, -3px); }
  }
  @keyframes icon-undo {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-25deg); }
  }

  [data-action="delete"]:hover .icon { animation: icon-shake 0.45s ease-in-out infinite; }
  [data-action="archive"]:hover .icon { animation: icon-drop 0.6s ease-in-out infinite; }
  [data-action="reply"]:hover .icon { animation: icon-slide-left 0.6s ease-in-out infinite; }
  [data-action="compose"]:hover .icon { animation: icon-write 0.5s ease-in-out infinite; }
  [data-action="wifi"]:hover .icon { animation: icon-pulse 0.7s ease-in-out infinite; }
  [data-action="back"]:hover .icon { animation: icon-slide-left 0.6s ease-in-out infinite; }
  [data-action="up"]:hover .icon { animation: icon-lift 0.55s ease-in-out infinite; }
  [data-action="down"]:hover .icon { animation: icon-drop 0.55s ease-in-out infinite; }
  [data-action="cancel-reply"]:hover .icon,
  [data-action="cancel-compose"]:hover .icon { animation: icon-shake 0.45s ease-in-out infinite; }
  [data-action="send-reply"]:hover .icon,
  [data-action="send-compose"]:hover .icon { animation: icon-send 0.5s ease-in-out infinite; }
  [data-action="undo"]:hover .icon { animation: icon-undo 0.6s ease-in-out infinite; }

  .wifi-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    margin-bottom: 18px;
  }

  .nav-pill {
    width: 46px;
    border-radius: 23px;
    flex-direction: column;
    padding: 8px 0;
    gap: 10px;
    margin-bottom: auto;
  }

  .nav-pill button {
    background: none;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
    margin-top: 20px;
  }

  .action-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s ease, background-color 0.2s ease, color 0.2s ease;
  }

  .action-btn.btn-hidden {
    transform: scale(0) !important;
    opacity: 0;
    pointer-events: none;
  }

  .action-btn.compose {
    background: #0e0e10;
    color: #fff;
  }

  .action-btn:hover, .nav-pill button:hover {
    filter: brightness(0.94);
  }

  .action-btn:active, .nav-pill button:active, .wifi-btn:active {
    transform: scale(0.93);
  }

  /* Wi-Fi on/off state */
  .wifi-slash { opacity: 0; transition: opacity 0.2s ease; }
  .wifi-wave { transition: opacity 0.2s ease; }
  .wifi-btn.off { --accent: #8e8e93; }
  .wifi-btn.off .icon { color: #c7c7cc; }
  .wifi-btn.off .wifi-slash { opacity: 1; }
  .wifi-btn.off .wifi-wave { opacity: 0.35; }

  .hidden { display: none !important; }

  /* Inline reply box */
  .reply-box {
    margin: -6px 0 20px 0;
    max-width: 460px;
    background: #f5f5f7;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .reply-box textarea {
    resize: none;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    color: var(--text-primary);
    min-height: 60px;
    outline: none;
  }

  .action-feedback {
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 500;
  }

  /* Compose (new email) view */
  .compose-header {
    padding-bottom: 14px;
    border-bottom: 1px solid var(--divider);
    margin-bottom: 16px;
  }

  .compose-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .compose-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 14px;
    max-width: 460px;
  }

  .compose-field label {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .compose-field input {
    border: none;
    border-bottom: 1px solid var(--divider);
    padding: 6px 0;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    color: var(--text-primary);
  }

  .compose-body {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-primary);
    max-width: 460px;
    min-height: 120px;
  }

  @media (max-width: 700px) {
    .device {
      height: auto;
      min-height: 640px;
      flex-direction: column;
      width: 100%;
    }
    .control-rail {
      flex-direction: row;
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--divider);
      justify-content: space-around;
      padding: 14px 10px;
    }
    .nav-pill { flex-direction: row; margin-bottom: 0; }
    .action-group { flex-direction: row; margin-top: 0; }
    .status-dot, .clock { display: none; }
    .attachment { height: 200px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="device" id="device">

    <div class="mail-panel" id="mailPanel" data-mode="read">
    </div>

    <div class="control-rail">
      <div class="clock" id="clock">9:41</div>
      <button class="wifi-btn ctrl-btn" data-action="wifi" style="--accent:#0a84ff" title="Wi-Fi" id="wifiBtn" onclick="toggleWifi(this)">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path class="wifi-wave" d="M2 8.5C7.5 3.5 16.5 3.5 22 8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="wifi-wave" d="M5.5 12.2C9.5 8.7 14.5 8.7 18.5 12.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="wifi-wave" d="M9 15.8C10.9 14.2 13.1 14.2 15 15.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle class="wifi-wave" cx="12" cy="19" r="1.3" fill="currentColor"/><line class="wifi-slash" x1="3" y1="4" x2="21" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>

      <div class="nav-pill">
        <button class="ctrl-btn" data-action="back" style="--accent:#5e5ce6" title="Back" onclick="pulse(this); goBack();">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="ctrl-btn" data-action="up" style="--accent:#ff9500" title="Up" onclick="pulse(this); navUp();">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="ctrl-btn" data-action="down" style="--accent:#ff9500" title="Down" onclick="pulse(this); navDown();">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="action-group" id="actionGroup">
        <button class="action-btn ctrl-btn" data-action="delete" style="--accent:#ff3b30" title="Delete" onclick="deleteMail()">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 7l.8 12.2c.05.98.87 1.75 1.85 1.75h5.7c.98 0 1.8-.77 1.85-1.75L17.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v5.5M14 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="action-btn ctrl-btn" data-action="archive" style="--accent:#0a84ff" title="Archive" onclick="archiveMail()">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 9v9.2c0 1 .8 1.8 1.8 1.8h11.4c1 0 1.8-.8 1.8-1.8V9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="action-btn ctrl-btn" data-action="reply" style="--accent:#34c759" title="Reply" onclick="pulse(this); toggleReply();">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M11 6L4 12l7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h9.5c3.6 0 6.5 2.9 6.5 6.5V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="action-btn compose ctrl-btn" data-action="compose" style="--accent:#af52de" title="Compose" onclick="pulse(this); openCompose();">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5l4 4L9 19H5v-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
  const emails = [
    {
      name: 'Camila Ferreira',
      to: 'Rafael Souza',
      subject: 'Viagem a Ouro Preto',
      body: 'Rafael, que viagem incrível! O passeio pela Praça Tiradentes acabou sendo o favorito de todo mundo. Separei as melhores fotos da minha câmera, incluindo algumas boas do grupo na Igreja de São Francisco de Assis. O resto vai para o álbum compartilhado ainda hoje à noite.',
      signoff: 'Camila',
      img: 'https://images.unsplash.com/photo-1663837804068-7d7b4c04044d?q=80&w=1200&auto=format&fit=crop',
      imgAlt: 'Vista de Ouro Preto, Minas Gerais'
    },
    {
      name: 'Rafael Souza',
      to: 'Camila Ferreira',
      subject: 'Re: Viagem a Ouro Preto',
      body: 'Camila, essas fotos das ladeiras ficaram incríveis! Mal posso esperar para ver o resto do álbum hoje à noite. As da Igreja de São Francisco de Assis com certeza vão virar quadro.',
      signoff: 'Rafael',
      img: 'https://images.unsplash.com/photo-1544456808-7530b2d112df?q=80&w=1200&auto=format&fit=crop',
      imgAlt: 'Ruas históricas de Ouro Preto, Minas Gerais'
    },
    {
      name: 'Grupo Viagem Ouro Preto',
      to: 'Todos',
      subject: 'Álbum compartilhado disponível',
      body: 'O álbum com todas as fotos da viagem já está no ar, incluindo o passeio pela Mina da Passagem e o Museu da Inconfidência. Adicionem os favoritos de vocês também!',
      signoff: 'Grupo da viagem',
      img: 'https://images.unsplash.com/photo-1573998375492-5fc9afb06408?q=80&w=1200&auto=format&fit=crop',
      imgAlt: 'Igreja histórica em Ouro Preto, Minas Gerais'
    }
  ];

  let currentIndex = 0;
  const panel = () => document.getElementById('mailPanel');

  function pulse(el) {
    el.style.transform = 'scale(0.88)';
    setTimeout(() => { el.style.transform = ''; }, 120);
  }

  function currentWeekday() {
    const dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    return dias[new Date().getDay()];
  }

  function readViewHTML(i) {
    const e = emails[i];
    return `
      <div class="mail-header">
        <div class="sender-block">
          <div class="avatar">
            <svg viewBox="0 0 42 42" xmlns="http://www.w3.org/2000/svg">
              <circle cx="21" cy="17" r="7" fill="#6b4a3a"/>
              <path d="M21 25c-8 0-13 4.5-13 10v7h26v-7c0-5.5-5-10-13-10z" fill="#3a2a22"/>
            </svg>
          </div>
          <div class="sender-text">
            <p class="name">${e.name}</p>
            <p class="to-line">To: ${e.to} <span class="chev">›</span></p>
          </div>
        </div>
        <div class="date-block">
          <span id="weekday">${currentWeekday()}</span>
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none"><path d="M15.5 3.5l5 5L8 21H3v-5L15.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <h1 class="mail-subject">${e.subject}</h1>

      <div class="mail-body">
        <p>${e.body}</p>
        <p class="signoff">${e.signoff}</p>
        <div id="replyBox" class="reply-box hidden">
          <textarea id="replyText" placeholder="Escreva sua resposta..."></textarea>
        </div>
      </div>

      <div class="attachment">
        <img src="${e.img}" alt="${e.imgAlt}">
      </div>
    `;
  }

  function checkIcon(color) {
    return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="${color}" stroke-width="1.8"/><path d="M7.5 12.5l3 3 6-6.5" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function feedbackHTML(text, color) {
    return `<div class="action-feedback" style="color:${color}">${checkIcon(color)}<span>${text}</span></div>`;
  }

  // Icon markup for each control-rail action button
  const ICONS = {
    delete: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 7V4.8c0-.44.36-.8.8-.8h4.4c.44 0 .8.36.8.8V7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 7l.8 12.2c.05.98.87 1.75 1.85 1.75h5.7c.98 0 1.8-.77 1.85-1.75L17.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v5.5M14 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    archive: '<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="4" rx="1" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 9v9.2c0 1 .8 1.8 1.8 1.8h11.4c1 0 1.8-.8 1.8-1.8V9" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    reply: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M11 6L4 12l7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h9.5c3.6 0 6.5 2.9 6.5 6.5V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    compose: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5l4 4L9 19H5v-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
    close: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    send: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-2.5-6.5L4 12z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    undo: '<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M7 7H4V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 13a8 8 0 1 0 2-8.5L4 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  // Which buttons live in the control rail for each mail-panel mode
  const ACTION_SETS = {
    read: [
      { action: 'delete', accent: '#ff3b30', title: 'Excluir', icon: ICONS.delete, onclick: 'deleteMail()' },
      { action: 'archive', accent: '#0a84ff', title: 'Arquivar', icon: ICONS.archive, onclick: 'archiveMail()' },
      { action: 'reply', accent: '#34c759', title: 'Responder', icon: ICONS.reply, onclick: 'pulse(this); toggleReply();' },
      { action: 'compose', accent: '#af52de', title: 'Novo e-mail', icon: ICONS.compose, onclick: 'pulse(this); openCompose();', extraClass: 'compose' }
    ],
    reply: [
      { action: 'cancel-reply', accent: '#8e8e93', title: 'Cancelar', icon: ICONS.close, onclick: 'closeReply()' },
      { action: 'send-reply', accent: '#34c759', title: 'Enviar', icon: ICONS.send, onclick: 'sendReply()', extraClass: 'compose' }
    ],
    compose: [
      { action: 'cancel-compose', accent: '#8e8e93', title: 'Cancelar', icon: ICONS.close, onclick: 'cancelCompose()' },
      { action: 'send-compose', accent: '#af52de', title: 'Enviar', icon: ICONS.send, onclick: 'sendCompose()', extraClass: 'compose' }
    ],
    gone: [
      { action: 'undo', accent: '#8e8e93', title: 'Desfazer', icon: ICONS.undo, onclick: 'undoAction()' }
    ]
  };

  function setActionButtons(setName) {
    const group = document.getElementById('actionGroup');
    if (!group) return;
    const wanted = ACTION_SETS[setName] || [];
    const wantedActions = wanted.map(w => w.action);

    // Shrink out buttons that no longer belong, then remove them once the animation finishes
    Array.from(group.children).forEach(el => {
      if (!wantedActions.includes(el.dataset.action)) {
        el.classList.add('btn-hidden');
        setTimeout(() => { if (el.parentNode) el.remove(); }, 320);
      }
    });

    // Pop in any buttons from the new set that aren't already present
    wanted.forEach(w => {
      if (group.querySelector(`[data-action="${w.action}"]`)) return;
      const btn = document.createElement('button');
      btn.className = 'action-btn ctrl-btn btn-hidden' + (w.extraClass ? ' ' + w.extraClass : '');
      btn.dataset.action = w.action;
      btn.style.setProperty('--accent', w.accent);
      btn.title = w.title;
      btn.setAttribute('onclick', w.onclick);
      btn.innerHTML = w.icon;
      group.appendChild(btn);
      requestAnimationFrame(() => requestAnimationFrame(() => btn.classList.remove('btn-hidden')));
    });
  }

  function renderReadView(i, animate) {
    if (animate === undefined) animate = true;
    const p = panel();
    const apply = () => {
      currentIndex = i;
      p.dataset.mode = 'read';
      p.innerHTML = readViewHTML(i);
      p.style.opacity = '1';
      p.style.transform = 'none';
    };
    if (animate) {
      p.style.transition = 'opacity 0.18s ease, transform 0.18s ease';
      p.style.opacity = '0';
      setTimeout(apply, 180);
    } else {
      apply();
    }
  }

  function navUp() {
    if (panel().dataset.mode !== 'read') return;
    renderReadView((currentIndex - 1 + emails.length) % emails.length);
  }

  function navDown() {
    if (panel().dataset.mode !== 'read') return;
    renderReadView((currentIndex + 1) % emails.length);
  }

  function goBack() {
    const p = panel();
    if (p.dataset.mode === 'compose') { cancelCompose(); return; }
    if (p.dataset.mode === 'gone') { undoAction(); return; }
    const reply = document.getElementById('replyBox');
    if (reply && !reply.classList.contains('hidden')) { closeReply(); return; }
    renderReadView(0);
  }

  function toggleReply() {
    const box = document.getElementById('replyBox');
    if (!box) return;
    box.classList.toggle('hidden');
    if (!box.classList.contains('hidden')) {
      document.getElementById('replyText').focus();
      setActionButtons('reply');
    } else {
      setActionButtons('read');
    }
  }

  function closeReply() {
    const box = document.getElementById('replyBox');
    if (box) box.classList.add('hidden');
    setActionButtons('read');
  }

  function sendReply() {
    const box = document.getElementById('replyBox');
    if (!box) return;
    box.innerHTML = '<div style="text-align:center;color:#34c759;font-weight:600;padding:8px 0;">Resposta enviada ✓</div>';
    setActionButtons('read');
    setTimeout(() => renderReadView(currentIndex, false), 1100);
  }

  function deleteMail() {
    const p = panel();
    p.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
    p.style.opacity = '0';
    p.style.transform = 'translateX(-30px)';
    setTimeout(() => {
      p.dataset.mode = 'gone';
      p.innerHTML = feedbackHTML('Mensagem excluída', '#ff3b30');
      p.style.opacity = '1';
      p.style.transform = 'none';
      setActionButtons('gone');
    }, 350);
  }

  function archiveMail() {
    const p = panel();
    p.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
    p.style.opacity = '0';
    p.style.transform = 'translateX(30px)';
    setTimeout(() => {
      p.dataset.mode = 'gone';
      p.innerHTML = feedbackHTML('Mensagem arquivada', '#0a84ff');
      p.style.opacity = '1';
      p.style.transform = 'none';
      setActionButtons('gone');
    }, 350);
  }

  function undoAction() {
    renderReadView(currentIndex, false);
    setActionButtons('read');
  }

  function composeHTML() {
    return `
      <div class="compose-header">
        <span class="compose-title">Novo e-mail</span>
      </div>
      <div class="compose-field">
        <label>Para</label>
        <input type="text" placeholder="destinatario@exemplo.com">
      </div>
      <div class="compose-field">
        <label>Assunto</label>
        <input type="text" placeholder="Assunto">
      </div>
      <textarea class="compose-body" placeholder="Escreva sua mensagem..."></textarea>
    `;
  }

  function openCompose() {
    const p = panel();
    p.style.transition = 'opacity 0.2s ease';
    p.style.opacity = '0';
    setTimeout(() => {
      p.dataset.mode = 'compose';
      p.innerHTML = composeHTML();
      p.style.opacity = '1';
      setActionButtons('compose');
    }, 200);
  }

  function cancelCompose() {
    renderReadView(currentIndex, false);
    setActionButtons('read');
  }

  function sendCompose() {
    const p = panel();
    p.innerHTML = feedbackHTML('E-mail enviado', '#af52de');
    setActionButtons('read');
    setTimeout(() => renderReadView(currentIndex, false), 1100);
  }

  let wifiOn = true;
  function toggleWifi(btn) {
    wifiOn = !wifiOn;
    btn.classList.toggle('off', !wifiOn);
  }

  // Live clock like the mock's "9:41"
  function updateClock() {
    const now = new Date();
    let h = now.getHours() % 12 || 12;
    let m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 30000);

  renderReadView(0, false);
</script>
